<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- form  -->
      <main class="card">
    <h1>Personalized page</h1>
     <form id="user-form">
      <label for="name">Your name</label>
      <input type="text" id="name" placeholder="e.g. Amina" required />
 
      <label for="age">Your age</label>
      <input type="number" id="age" placeholder="e.g. 20" min="1" max="120" required />
 
      <button type="submit">Save</button>
    </form>
<!-- results  -->
<section id="results" class="hidden">

<!-- greeting  -->
  <div class="box">
    <h2 id="greeting"></h2>
  </div>

<!-- age  -->
  <div class="box">
    <h3>Your age in months</h3>
    <p id="months"></p>
  </div>

</section>
</body>
</html>
